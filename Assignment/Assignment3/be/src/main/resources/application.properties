spring.application.name=FUMiniHotelSystem

# ── SQL Server ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3HotelDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── Server ─────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=FUMiniHotelSystemSecretKey2024FUMiniHotelSystemSecretKey2024FUMini
app.jwt.expiration-ms=86400000

# ── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
